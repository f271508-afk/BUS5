<style>
:root{--bg:#DFF3E3;--panel:#fff;--ink:#16252e;--sub:#5d7280;--line:#c2dac7;--led:#ffb000;--ledbg:#1b1408;--route:#0a6e8a;--soon:#d4380d}
@media (prefers-color-scheme:dark){:root{--bg:#0f2218;--panel:#173425;--ink:#e6eef2;--sub:#8ea6b3;--line:#2d4f3d;--route:#4fc3e0;--soon:#ff8a5c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
form{display:flex;gap:8px;margin-bottom:12px}
select,input,button{font:inherit;color:var(--ink)}
select,input{padding:11px 12px;border:2px solid var(--line);border-radius:10px;background:var(--panel)}
input{flex:1;min-width:0}
.go{padding:0 18px;border:0;border-radius:10px;background:var(--route);color:#fff;font-weight:700;cursor:pointer}
:focus-visible{outline:3px solid var(--route);outline-offset:2px}
details{background:var(--panel);border-radius:10px;padding:10px 14px;margin-bottom:12px}
summary{cursor:pointer;font-weight:500}
details input{width:100%;margin-top:8px;flex:none}
details p{font-size:13px;color:var(--sub);margin:8px 0 0}
.board{background:var(--ledbg);color:var(--led);border-radius:12px;padding:14px 16px;margin:8px 0 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.board b{font-size:30px;letter-spacing:.04em;line-height:1.1}
.board small{display:block;color:#c58a1a;font-size:13px}
.board .eta{font-size:28px;font-weight:700;text-align:right;min-width:90px}
.dir{display:flex;gap:6px;margin-bottom:10px}
.dir button{flex:1;padding:10px 8px;border:2px solid var(--line);background:var(--panel);border-radius:8px;cursor:pointer}
.dir button[aria-pressed="true"]{border-color:var(--route);font-weight:700}
ol{list-style:none;margin:0;padding:0;background:var(--panel);border-radius:12px;overflow:hidden}
li{display:flex;align-items:center;gap:12px;padding:0 14px;min-height:56px}
li+li{border-top:1px solid var(--line)}
.rail{width:18px;align-self:stretch;position:relative;flex:none}
.rail:before{content:"";position:absolute;left:8px;top:0;bottom:0;width:3px;background:var(--line)}
li:first-child .rail:before{top:50%}li:last-child .rail:before{bottom:50%}
.rail i{position:absolute;left:3px;top:calc(50% - 6px);width:13px;height:13px;border-radius:50%;background:var(--panel);border:3px solid var(--route)}
.rail i.bus{background:var(--soon);border-color:var(--soon);box-shadow:0 0 0 5px color-mix(in srgb,var(--soon) 25%,transparent)}
.name{flex:1;font-weight:500}
.tag{min-width:64px;text-align:center;padding:4px 8px;border-radius:6px;background:var(--bg);font-weight:700;font-size:14px}
.tag.soon{background:var(--soon);color:#fff}
.tag.none{color:var(--sub);font-weight:400}
.fav{border:0;background:none;font-size:22px;cursor:pointer;color:var(--sub);padding:6px}
.fav[aria-pressed="true"]{color:#e0a100}
.msg{padding:24px;text-align:center;color:var(--sub)}
.msg.err{color:var(--soon)}
.meta{font-size:13px;color:var(--sub);text-align:right;margin-top:8px}
#saved:empty,#savedstops:empty{display:none}
#saved,#savedstops{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sc{display:inline-flex;border:2px solid var(--line);border-radius:999px;background:var(--panel);overflow:hidden}
.sc.on{border-color:var(--route)}
.sc button{border:0;background:none;cursor:pointer;padding:6px 12px;font-weight:500}
.sc .rm{padding:6px 10px 6px 0;color:var(--sub)}
.savebtn{display:block;width:100%;margin-bottom:8px;padding:10px;border:2px dashed var(--line);border-radius:10px;background:none;cursor:pointer;font-weight:500}
.savebtn[aria-pressed="true"]{border-style:solid;border-color:var(--route)}
.nm{border:0;background:none;text-align:left;cursor:pointer;padding:14px 0;font-weight:500;text-decoration:underline dotted var(--sub);text-underline-offset:4px}
dialog{border:0;border-radius:14px;padding:16px;width:calc(100% - 24px);max-width:480px;max-height:80vh;overflow:auto;background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.dh h2{font-size:17px;margin:0}
.dh button{border:2px solid var(--line);background:none;border-radius:8px;padding:4px 10px;cursor:pointer}
.rt{display:flex;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:12px 0;cursor:pointer;text-align:left}
.rt b{font-size:18px;min-width:70px}
.rt span.d{flex:1;color:var(--sub);font-size:13px}
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-2px 0 12px;font-size:14px}
.ctl input{flex:none;width:auto;padding:0;margin-right:4px;vertical-align:-2px}
#upd{margin-left:auto;color:var(--sub);font-size:13px}
.rfb{border:2px solid var(--line);background:var(--panel);border-radius:8px;padding:2px 10px;cursor:pointer;margin-left:6px}
#mapbox{margin-bottom:12px}
#map{height:320px;border-radius:10px;margin-top:10px;position:relative;z-index:0}
.busicon{font-size:22px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.leaflet-container{font:inherit}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
function showErr(m) {
  var el = document.getElementById("errbar"), mn = document.querySelector("main");
  if (!el) { el = document.createElement("div"); el.id = "errbar"; el.className = "msg err"; mn.insertBefore(el, mn.children[1]); }
  el.textContent = "發生錯誤：" + m;
}
window.addEventListener("error", function (e) { showErr(String((e && e.message) || "未知錯誤")); });
window.addEventListener("unhandledrejection", function (e) { var r = e && e.reason; showErr(String(r && r.message ? r.message : r)); });
var BASE = "https://tdx.transportdata.tw/api/basic/v2/Bus";
var TOKEN_URL = "https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token";
var S = { city: "Taipei", route: "", dir: "0", data: null, favs: {}, saved: [], savedStops: [], auto: false, timer: null, token: null, exp: 0, stops: {}, cid: "", csec: "" };
var $ = function (id) { return document.getElementById(id); };
try {
  var p = JSON.parse(localStorage.getItem("busprefs") || "{}");
  if (p.city) S.city = p.city; if (p.route) S.route = p.route;
  S.favs = p.favs || {}; S.saved = p.saved || []; S.auto = !!p.auto; S.savedStops = p.savedStops || []; S.cid = p.cid || ""; S.csec = p.csec || "";
} catch (e) {}
function save() { try { localStorage.setItem("busprefs", JSON.stringify({ city: S.city, route: S.route, favs: S.favs, saved: S.saved, savedStops: S.savedStops, auto: S.auto, cid: S.cid, csec: S.csec })); } catch (e) {} }
function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

async function getToken() {
  if (S.token && Date.now() < S.exp) return S.token;
  var r = await fetch(TOKEN_URL, {
    method: "POST",
    headers: { "content-type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({ grant_type: "client_credentials", client_id: S.cid, client_secret: S.csec })
  });
  if (!r.ok) {
    var detail = ""; try { var ej = await r.json(); detail = (ej.error || "") + (ej.error_description ? "：" + ej.error_description : ""); } catch (x) {}
    throw new Error("取得 token 失敗（" + r.status + "）" + (detail ? "，伺服器回應：" + detail : "") + "。請檢查 client_id 與 client_secret");
  }
  var j = await r.json();
  S.token = j.access_token; S.exp = Date.now() + (j.expires_in - 60) * 1000;
  return S.token;
}
async function tdx(kind) {
  var filter = "RouteName/Zh_tw eq '" + S.route + "'";
  var url = BASE + "/" + kind + "/City/" + S.city + "/" + encodeURIComponent(S.route) + "?$filter=" + encodeURIComponent(filter) + "&$format=JSON";
  var r = await fetch(url, { headers: { authorization: "Bearer " + (await getToken()) } });
  if (r.status === 401) S.token = null;
  if (!r.ok) { var er = new Error(kind + " 回應 " + r.status); er.status = r.status; er.kind = kind; er.retryAfter = parseInt(r.headers.get("retry-after") || "0", 10) || 0; throw er; }
  return r.json();
}

function build(stopsData, etaData, nearData) {
  var dirs = {};
  [0, 1].forEach(function (d) {
    var c = stopsData.filter(function (x) { return x.Direction === d; });
    if (!c.length) return;
    var main = c.reduce(function (a, b) { return b.Stops.length > a.Stops.length ? b : a; });
    var etas = {};
    etaData.forEach(function (e) {
      if (e.Direction !== d) return;
      var cur = etas[e.StopUID];
      if (!cur || (e.EstimateTime != null && (cur.EstimateTime == null || e.EstimateTime < cur.EstimateTime))) etas[e.StopUID] = e;
    });
    dirs[d] = main.Stops.slice().sort(function (a, b) { return a.StopSequence - b.StopSequence; }).map(function (s) {
      var e = etas[s.StopUID] || {};
      return { uid: s.StopUID, lat: s.StopPosition ? s.StopPosition.PositionLat : null, lon: s.StopPosition ? s.StopPosition.PositionLon : null, name: s.StopName.Zh_tw, eta: e.EstimateTime == null ? null : e.EstimateTime, status: e.StopStatus == null ? null : e.StopStatus };
    });
  });
  var buses = nearData.map(function (b) { return { dir: b.Direction, uid: b.StopUID }; });
  return { dirs: dirs, buses: buses, updated: new Date().toISOString() };
}

function fmt(s) {
  if (s.eta != null && (s.status === 0 || s.status == null)) {
    return s.eta <= 60 ? { t: "進站中", c: "soon" } : { t: Math.ceil(s.eta / 60) + " 分", c: s.eta <= 300 ? "soon" : "" };
  }
  var m = { 1: "尚未發車", 2: "不停靠", 3: "末班已過", 4: "今日未營運" };
  return { t: m[s.status] || "無資料", c: "none" };
}

async function load(spin) {
  if (spin) $("view").innerHTML = '<div class="msg">載入中…</div>';
  var key = S.city + "|" + S.route;
  try {
    if (!S.stops[key]) S.stops[key] = await tdx("StopOfRoute");
    if (!S.stops[key].length) throw new Error("找不到這條路線，請確認縣市與路線名稱");
    // 車輛位置每兩次更新才抓一次，以減少請求量
    if (S.nearKey !== key) { S.nearKey = key; S.lastNear = null; S.cycle = 0; }
    S.cycle = (S.cycle || 0) + 1;
    var eta = await tdx("EstimatedTimeOfArrival");
    if (!S.lastNear || S.cycle % 2 === 1) S.lastNear = await tdx("RealTimeNearStop").catch(function () { return S.lastNear || []; });
    S.delay = 60000;
    S.dataKey = key;
    S.data = build(S.stops[key], eta, S.lastNear);
    if (!S.data.dirs[S.dir]) S.dir = Object.keys(S.data.dirs)[0];
    render();
  } catch (e) {
    if (e.status === 429) { S.delay = e.retryAfter ? Math.min(e.retryAfter * 1000, 300000) : Math.min((S.delay || 60000) * 2, 300000); }
    var msg429 = "TDX 回應請求過於頻繁（429" + (e.kind ? "，" + e.kind : "") + "）。請至少等 " + Math.round(S.delay / 1000) + " 秒再按「立即更新」，並確認沒有同時開多個分頁或其他程式在使用同一組金鑰。";
    if (e.status === 429 && S.data && S.dataKey === key) {
      render();
      $("view").insertAdjacentHTML("afterbegin", '<div class="msg err">' + esc(msg429 + "（目前顯示的是上一次的資料）") + "</div>");
      return;
    }
    S.data = null;
    var msg = e.status === 429 ? msg429 : e instanceof TypeError ? "連線失敗，可能是網路問題或瀏覽器的 CORS 限制。若持續發生，請改用 server.js 版本。" : e.message;
    $("view").innerHTML = '<div class="msg err">' + esc(msg) + "</div>";
  }
}

var DIRS = { 0: "去程", 1: "返程", 2: "迴圈", 255: "未知" };
async function routeInfo(city) {
  S.ri = S.ri || {};
  if (S.ri[city]) return S.ri[city];
  var url = BASE + "/Route/City/" + city + "?$select=" + encodeURIComponent("RouteName,DepartureStopNameZh,DestinationStopNameZh") + "&$top=5000&$format=JSON";
  var r = await fetch(url, { headers: { authorization: "Bearer " + (await getToken()) } });
  if (!r.ok) throw new Error("Route " + r.status);
  var m = {};
  (await r.json()).forEach(function (x) {
    var n = x.RouteName && x.RouteName.Zh_tw;
    if (n && !m[n]) m[n] = { from: x.DepartureStopNameZh || "", to: x.DestinationStopNameZh || "" };
  });
  S.ri[city] = m;
  return m;
}
function dirLabel(x, info) {
  var i = info[x.route], d = DIRS[x.dir] || "";
  if (!i) return d;
  var t = x.dir === 0 ? i.to : x.dir === 1 ? i.from : "";
  return d + (t ? "・往 " + t : "");
}
async function showStop(name, city) {
  var dlg = $("dlg"); city = city || S.city; S.stopName = name; S.stopCity = city; updDsv();
  $("dtitle").textContent = cityName(city) + "・經過「" + name + "」的路線";
  $("dbody").innerHTML = '<div class="msg">載入中…</div>';
  if (!dlg.open) dlg.showModal();
  try {
    var filter = "StopName/Zh_tw eq '" + name.replace(/'/g, "''") + "'";
    var url = BASE + "/EstimatedTimeOfArrival/City/" + city + "?$filter=" + encodeURIComponent(filter) + "&$top=500&$format=JSON";
    var r = await fetch(url, { headers: { authorization: "Bearer " + (await getToken()) } });
    if (r.status === 401) S.token = null;
    if (r.status === 429) throw new Error("TDX 回應請求過於頻繁（429），請稍等一會兒再按「更新」。");
    if (!r.ok) throw new Error("查詢失敗（" + r.status + "）");
    var arr = await r.json(), g = {};
    arr.forEach(function (e) {
      var k = e.RouteName.Zh_tw + "|" + e.Direction, cur = g[k];
      var eta = e.EstimateTime == null ? null : e.EstimateTime;
      if (!cur || (eta != null && (cur.eta == null || eta < cur.eta))) g[k] = { route: e.RouteName.Zh_tw, dir: e.Direction, eta: eta, status: e.StopStatus == null ? null : e.StopStatus };
    });
    var list = Object.keys(g).map(function (k) { return g[k]; }).sort(function (a, b) {
      var x = a.eta == null ? 1e9 : a.eta, y = b.eta == null ? 1e9 : b.eta;
      return x - y || a.route.localeCompare(b.route, "zh-Hant", { numeric: true });
    });
    if (!list.length) { $("dbody").innerHTML = '<div class="msg">這個縣市查不到經過此站名的路線。</div>'; return; }
    var info = {}; try { info = await routeInfo(city); } catch (e) {}
    $("dbody").innerHTML = list.map(function (x, i) {
      var f = fmt(x);
      return '<button class="rt" data-i="' + i + '"><b>' + esc(x.route) + '</b><span class="d">' + dirLabel(x, info) + '</span><span class="tag ' + f.c + '">' + f.t + "</span></button>";
    }).join("");
    $("dbody").querySelectorAll(".rt").forEach(function (b) {
      b.onclick = function () { $("city").value = city; $("route").value = list[b.dataset.i].route; dlg.close(); $("f").requestSubmit(); };
    });
  } catch (e) {
    $("dbody").innerHTML = '<div class="msg err">' + esc(e instanceof TypeError ? "連線失敗，請檢查網路或改用 server.js 版本。" : e.message) + "</div>";
  }
}
$("dcl").onclick = function () { $("dlg").close(); };
$("drf").onclick = function () { if (S.stopName) showStop(S.stopName, S.stopCity); };
function stopSavedIdx() { return S.savedStops.findIndex(function (x) { return x.city === S.stopCity && x.name === S.stopName; }); }
function updDsv() { var b = $("dsv"), on = stopSavedIdx() >= 0; b.textContent = on ? "★ 已儲存" : "☆ 儲存站名"; b.setAttribute("aria-pressed", on); }
function renderSavedStops() {
  var el = $("savedstops");
  el.innerHTML = S.savedStops.map(function (x, i) {
    return '<span class="sc"><button class="pk" data-i="' + i + '">📍 ' + esc(cityName(x.city)) + " " + esc(x.name) +
      '</button><button class="rm" data-i="' + i + '" aria-label="移除站名 ' + esc(x.name) + '">×</button></span>';
  }).join("");
  el.querySelectorAll(".pk").forEach(function (b) { b.onclick = function () { var x = S.savedStops[b.dataset.i]; showStop(x.name, x.city); }; });
  el.querySelectorAll(".rm").forEach(function (b) { b.onclick = function () { S.savedStops.splice(b.dataset.i, 1); save(); renderSavedStops(); updDsv(); }; });
}
$("dsv").onclick = function () {
  var i = stopSavedIdx();
  if (i >= 0) S.savedStops.splice(i, 1); else S.savedStops.push({ city: S.stopCity, name: S.stopName });
  save(); updDsv(); renderSavedStops();
};
function schedule() { clearTimeout(S.timer); if (!S.auto) return; S.timer = setTimeout(tick, S.delay); }
async function tick() {
  if (document.hidden) { S.stale = true; return; } // 分頁在背景時暫停更新
  await load(false);
  schedule();
}
document.addEventListener("visibilitychange", function () {
  if (!document.hidden && S.stale && S.route && S.cid) { S.stale = false; tick(); }
});
var map = null, layer = null;
function drawMap() { try { drawMapInner(); } catch (e) { showErr("地圖：" + String(e && e.message ? e.message : e)); } }
function drawMapInner() {
  var det = $("mapbox");
  if (!det.open || !S.data) return;
  if (typeof L === "undefined") { $("map").innerHTML = '<div class="msg err">地圖元件載入失敗，請確認網路可連到 cdnjs.cloudflare.com。</div>'; return; }
  if (!map) {
    map = L.map("map");
    var TILES = [
      { name: "CARTO 淡色", url: "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", o: { maxZoom: 19, subdomains: "abcd", attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 貢獻者 &copy; <a href="https://carto.com/attributions">CARTO</a>' } },
      { name: "OpenStreetMap", url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png", o: { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 貢獻者' } },
      { name: "Esri 街道", url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", o: { maxZoom: 19, attribution: "Tiles &copy; Esri" } }
    ];
    TILES.unshift(TILES.splice(2, 1)[0]); // Esri 街道設為預設，失敗時依序改用 CARTO、OpenStreetMap
    var baseLayers = {}, cur = 0, errs = 0, ok = false;
    var objs = TILES.map(function (t) { var l = L.tileLayer(t.url, t.o); baseLayers[t.name] = l; return l; });
    var useTile = function (n) {
      objs.forEach(function (l) { if (map.hasLayer(l)) map.removeLayer(l); });
      cur = n; errs = 0; ok = false; objs[n].addTo(map);
    };
    objs.forEach(function (l, n) {
      l.on("tileload", function () { if (n === cur) ok = true; });
      l.on("tileerror", function () {
        if (n !== cur || ok) return;
        errs++;
        if (errs >= 4) {
          if (cur < objs.length - 1) useTile(cur + 1);
          else if (errs === 4) showErr("地圖底圖無法載入，請檢查網路，或暫時停用廣告攔截外掛。");
        }
      });
    });
    L.control.layers(baseLayers).addTo(map);
    map.on("baselayerchange", function (e) { cur = objs.indexOf(e.layer); errs = 0; ok = true; });
    useTile(0);
    layer = L.layerGroup().addTo(map);
  }
  layer.clearLayers();
  var stops = (S.data.dirs[S.dir] || []).filter(function (x) { return x.lat != null && x.lon != null; });
  if (!stops.length) { map.setView([23.7, 121], 7); setTimeout(function () { map.invalidateSize(); }, 0); return; }
  var pts = stops.map(function (x) { return [x.lat, x.lon]; });
  L.polyline(pts, { color: "#0a6e8a", weight: 4, opacity: 0.8 }).addTo(layer);
  var busAt = {};
  S.data.buses.forEach(function (b) { if (String(b.dir) === S.dir) busAt[b.uid] = true; });
  stops.forEach(function (st) {
    var f = fmt(st);
    var m = L.circleMarker([st.lat, st.lon], { radius: 6, color: "#0a6e8a", fillColor: "#fff", fillOpacity: 1, weight: 3 }).addTo(layer);
    m.bindPopup("<b>" + esc(st.name) + "</b><br>" + f.t + '<br><a href="#" class="lk">查看經過此站的路線</a>');
    m.on("popupopen", function (ev) {
      var a = ev.popup.getElement().querySelector(".lk");
      if (a) a.onclick = function (e2) { e2.preventDefault(); showStop(st.name); };
    });
    if (busAt[st.uid]) {
      L.marker([st.lat, st.lon], { icon: L.divIcon({ className: "", html: '<div class="busicon">🚌</div>', iconSize: [24, 24], iconAnchor: [12, 12] }), zIndexOffset: 500 }).addTo(layer)
        .bindPopup("<b>" + esc(st.name) + "</b><br>公車在此站附近");
    }
  });
  var key = S.city + "|" + S.route + "|" + S.dir;
  setTimeout(function () { map.invalidateSize(); if (S.mapKey !== key) { map.fitBounds(pts, { padding: [20, 20] }); S.mapKey = key; } }, 0);
}
$("mapbox").addEventListener("toggle", drawMap);
function cityName(c) { var o = $("city").querySelector('option[value="' + c + '"]'); return o ? o.textContent : c; }
function savedIdx() { return S.saved.findIndex(function (x) { return x.city === S.city && x.route === S.route; }); }
function renderSaved() {
  var el = $("saved");
  el.innerHTML = S.saved.map(function (x, i) {
    var on = x.city === S.city && x.route === S.route;
    return '<span class="sc' + (on ? " on" : "") + '"><button class="pick" data-i="' + i + '">' + esc(cityName(x.city)) + " " + esc(x.route) +
      '</button><button class="rm" data-i="' + i + '" aria-label="移除 ' + esc(x.route) + '">×</button></span>';
  }).join("");
  el.querySelectorAll(".pick").forEach(function (b) { b.onclick = function () { var x = S.saved[b.dataset.i]; $("city").value = x.city; $("route").value = x.route; $("f").requestSubmit(); }; });
  el.querySelectorAll(".rm").forEach(function (b) { b.onclick = function () { S.saved.splice(b.dataset.i, 1); save(); if (S.data) render(); else renderSaved(); }; });
}
function render() {
  var d = S.data; if (!d) return;
  var keys = Object.keys(d.dirs), stops = d.dirs[S.dir];
  var fk = S.city + "|" + S.route, fu = S.favs[fk];
  var idx = Math.max(0, stops.findIndex(function (s) { return s.uid === fu; }));
  var e = fmt(stops[idx]);
  var h = '<button class="savebtn" id="sv" aria-pressed="' + (savedIdx() >= 0) + '">' + (savedIdx() >= 0 ? "★ 已儲存此路線（點一下取消）" : "☆ 儲存此路線") + '</button><div class="board"><div><b>' + esc(S.route) + "</b><small>" + (fu ? "收藏站牌" : "首站") + "：" + esc(stops[idx].name) +
    '</small></div><div class="eta">' + e.t + "</div></div>";
  h += '<div class="dir">' + keys.map(function (k) {
    return '<button data-d="' + k + '" aria-pressed="' + (k === S.dir) + '">往 ' + esc(d.dirs[k][d.dirs[k].length - 1].name) + "</button>";
  }).join("") + "</div><ol>";
  var here = {}; d.buses.forEach(function (b) { if (String(b.dir) === S.dir) here[b.uid] = true; });
  stops.forEach(function (s, i) {
    var x = fmt(s);
    h += '<li><span class="rail"><i class="' + (here[s.uid] ? "bus" : "") + '"></i></span><button class="name nm" data-i="' + i + '" title="查看經過此站的所有路線">' + esc(s.name) +
      '</button><span class="tag ' + x.c + '">' + x.t + '</span><button class="fav" data-u="' + esc(s.uid) + '" aria-label="收藏 ' + esc(s.name) +
      '" aria-pressed="' + (fu === s.uid) + '">' + (fu === s.uid ? "★" : "☆") + "</button></li>";
  });
  h += "</ol>";
  $("upd").textContent = "更新於 " + new Date(d.updated).toLocaleTimeString("zh-TW");
  drawMap();
  $("view").innerHTML = h;
  $("sv").onclick = function () { var i = savedIdx(); if (i >= 0) S.saved.splice(i, 1); else S.saved.push({ city: S.city, route: S.route }); save(); render(); };
  $("view").querySelectorAll(".nm").forEach(function (b) { b.onclick = function () { showStop(stops[b.dataset.i].name); }; });
  renderSaved();
  $("view").querySelectorAll(".dir button").forEach(function (b) { b.onclick = function () { S.dir = b.dataset.d; render(); }; });
  $("view").querySelectorAll(".fav").forEach(function (b) {
    b.onclick = function () { if (S.favs[fk] === b.dataset.u) delete S.favs[fk]; else S.favs[fk] = b.dataset.u; save(); render(); };
  });
}

$("f").addEventListener("submit", function (ev) {
  ev.preventDefault();
  var cid = $("cid").value.trim(), csec = $("csec").value.trim();
  if (cid !== S.cid || csec !== S.csec) { S.token = null; }
  S.cid = cid; S.csec = csec;
  if (!cid || !csec) { $("cred").open = true; $("view").innerHTML = '<div class="msg err">請先填入 TDX 金鑰。</div>'; return; }
  S.city = $("city").value; S.route = $("route").value.trim().replace(/'/g, ""); S.dir = "0"; save();
  clearTimeout(S.timer); S.delay = 60000; S.stale = false; load(true).then(schedule);
});
$("city").value = S.city; $("route").value = S.route; $("cid").value = S.cid; $("csec").value = S.csec;
$("au").checked = S.auto;
$("au").onchange = function () { S.auto = this.checked; save(); clearTimeout(S.timer); if (S.auto) schedule(); };
$("rf").onclick = function () {
  var b = this, now = Date.now();
  if (!S.route || !S.cid) { return; }
  if (S.lastManual && now - S.lastManual < 15000) { b.textContent = "請稍後再按"; setTimeout(function () { b.textContent = "立即更新"; }, 2000); return; }
  S.lastManual = now; clearTimeout(S.timer); load(false).then(schedule);
};
renderSaved(); renderSavedStops();
if (!S.cid) $("cred").open = true;
else if (S.route) $("f").requestSubmit();
</script>
</body>
</html>
